  const rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
  function burst(x,y,k){if(rm)return;const r=w.getBoundingClientRect();for(let i=0;i<(k||16);i++){const p=h("span",{class:"bp"});p.textContent=G[Math.floor(Math.random()*G.length)];const a=Math.random()*6.283,d=70+Math.random()*130;p.style.cssText=`left:${x-r.left}px;top:${y-r.top}px;color:${PAL[i%6]};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-40}px;--r:${(Math.random()-.5)*540}deg`;w.append(p);setTimeout(()=>p.remove(),1200)}}
  let ac=null;
  function chord(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime,roots=[82.41,110,98,73.42,87.31],f=roots[Math.floor(Math.random()*roots.length)];
    const ws=ac.createWaveShaper(),cv=new Float32Array(256);for(let i=0;i<256;i++){const x=i/128-1;cv[i]=Math.tanh(x*5)}ws.curve=cv;
    const lp=ac.createBiquadFilter();lp.type="lowpass";lp.frequency.value=2600;const g=ac.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.35,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.9);
    ws.connect(lp);lp.connect(g);g.connect(ac.destination);
    [1,1.5,2].forEach(m=>{const o=ac.createOscillator();o.type="sawtooth";o.frequency.value=f*m;o.connect(ws);o.start(t);o.stop(t+.95)});
    const k=ac.createOscillator(),kg=ac.createGain();k.frequency.setValueAtTime(160,t);k.frequency.exponentialRampToValueAtTime(40,t+.18);kg.gain.setValueAtTime(.7,t);kg.gain.exponentialRampToValueAtTime(.0001,t+.25);k.connect(kg);kg.connect(ac.destination);k.start(t);k.stop(t+.3)}catch(e){}}
  const hint=w.querySelector(".hint"),dishes=[];menu.forEach(m=>m.i.forEach(i=>{const e=eff(i,i.v[0]);if(!e.off)dishes.push({n:i.n,p:e.p,c:m.c})}));
  function pick(){const d=dishes[Math.floor(Math.random()*dishes.length)];if(!d)return;hint.classList.remove("pk");void hint.offsetWidth;hint.classList.add("pk");hint.innerHTML=`\u{1F3B2} Today\u2019s Rock Pick<b>${(EM[d.c]||"")+" "+d.n.replace(/&/g,"&amp;")}</b>from ${R(d.p)} \u00b7 tap to roll again`;}
  function flash(){if(rm)return;const f=h("div",{class:"fl"});w.append(f);setTimeout(()=>f.remove(),500)}
  function hit(x,y){if(S.sound)chord();flash();burst(x,y,18);try{navigator.vibrate&&navigator.vibrate(20)}catch(e){}}
  w.querySelector(".rec").onclick=e=>{e.stopPropagation();const b=e.currentTarget.getBoundingClientRect();hit(b.left+b.width/2,b.top+b.height/2);pick()};
  hint.onclick=e=>{e.stopPropagation();const b=hint.getBoundingClientRect();hit(b.left+b.width/2,b.top);pick()};
  w.append(h("button",{class:"go",onclick:e=>{e.stopPropagation();go()}},n?"Open the menu":"Enter"));
  w.onclick=e=>{burst(e.clientX,e.clientY,10)};
  app.append(w);
  setTimeout(()=>{const b=w.querySelector(".rec").getBoundingClientRect();burst(b.left+b.width/2,b.top+b.height/2,20)},1000);
}

/* ---------- Menu price editor (manager) ---------- */
let ov={},menuDoc=null,settingsDoc=null,sw=0;
function watchSettings(){if(sw||!settingsDoc)return;sw=1;settingsDoc.onSnapshot(x=>{try{const d=x.data();if(!d)return;const before=JSON.stringify(S);Object.assign(S,d);TABLES=Math.max(1,Math.min(50,+S.tables||10));if(before!==JSON.stringify(S)&&(location.hash===""||location.hash==="#"))route()}catch(e){}})}
const key=(n,l)=>(n+"|"+l).replace(/[^a-zA-Z0-9]/g,"");
const eff=(i,v)=>{const o=ov[key(i.n,v.l)]||{};return{p:o.p>0?o.p:v.p,off:!!o.off}};
function watchMenu(cb){getDb().then(ok=>{if(ok&&menuDoc)menuDoc.onSnapshot(s=>{try{const d=s.data();ov=(d&&d.ov)?{...d.ov}:{}}catch(e){ov={}}cb()})})}
function editor(){
  app.innerHTML="";let q="";
  const list=h("div"),search=h("input",{class:"s",placeholder:"Search an item to edit…"});
  app.append(head("Edit menu & prices"),h("div",{class:"wrap"},nav(),h("p",{class:"sub"},"Change a price or mark an item sold out. Customers see it straight away."),search,list));
  const save=(k,o)=>{if(!menuDoc){toast("Not connected. Try again.");return Promise.reject()}const n={...ov};if(o)n[k]=o;else delete n[k];ov=n;return menuDoc.set({ov:n}).then(()=>toast("Saved ✓")).catch(()=>{toast("Save failed");throw 0})};
  function draw(){
    list.innerHTML="";
    menu.forEach(m=>{const its=m.i.filter(i=>i.n.toLowerCase().includes(q));if(!its.length)return;
      list.append(h("h2",{},m.c));
      its.forEach(i=>{const box=h("div",{class:"it"},h("b",{},i.n));
        i.v.forEach(v=>{const k=key(i.n,v.l),o=ov[k]||{},changed=o.p>0&&o.p!==v.p,
          inp=h("input",{class:"u",type:"number",inputmode:"numeric",value:o.p>0?o.p:v.p,style:"width:92px"});
          box.append(h("div",{class:"row"},h("span",{},v.l||"Price"),
            h("span",{style:"display:flex;gap:6px;align-items:center"},"₹",inp,
              h("button",{class:"sm",onclick:()=>{const p=Math.round(+inp.value);if(!(p>0))return toast("Enter a valid price");save(k,{...(ov[k]||{}),p}).then(draw).catch(()=>{})}},"Save"),
              h("button",{class:"sm"+(o.off?"":" o"),onclick:()=>save(k,{...(ov[k]||{}),off:!o.off}).then(draw).catch(()=>{})},o.off?"Sold out":"Available"))));
          if(changed)box.append(h("div",{class:"sub"},"Original ₹"+v.p+" · ",h("a",{href:"#menu",onclick:e=>{e.preventDefault();save(k,o.off?{off:true}:null).then(draw).catch(()=>{})}},"reset")))});
        list.append(box)})})
  }
  search.oninput=()=>{q=search.value.toLowerCase();draw()};
  draw();watchMenu(draw);
}

/* ---------- Router ---------- */
function home(){app.innerHTML="";const qc=h("div",{class:"c"});
  app.append(head(S.tag),h("div",{class:"wrap"},h("p",{class:"sub"},S.addr+" \u00b7 "+S.phone),h("p",{class:"sub"},"Scan the QR code on your table to order."),
    h("div",{class:"qc hm-qr"},h("b",{},"Scan to order"),qc,h("div",{style:"font-size:11px;margin-top:6px"},S.name+" \u00b7 menu")),
    h("p",{class:"sub"},"Staff links:"),nav(),h("h2",{},"Open a table"),h("div",{class:"nav"},Array.from({length:TABLES},(_,i)=>h("a",{href:"#t"+(i+1)},"Table "+(i+1))))));
  mkQR(qc,S.url||location.href.split("#")[0],180)}
function route(){
  const x=location.hash.slice(1),m=x.match(/^t(\d+)$/);
  if(m&&+m[1]>=1&&+m[1]<=TABLES)splash(+m[1]);
  else if(x==="staff"||x==="chef"||x==="manager")gate(x,()=>dash(x));
  else if(x==="menu")gate("manager",editor);
  else if(x==="qr")gate("manager",qr);
  else if(x==="settings")gate("manager",settings);
  else splash(null);
  window.scrollTo(0,0);
}
addEventListener("hashchange",route);getDb();route();
</script></body></html>
